<!DOCTYPE html>
<html lang="zh-CN">

<link rel="manifest" href="manifest.webmanifest">

<title>四级 1500 词 · 背词本</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f7f6f3; --card:#ffffff; --line:#e8e6e1; --line2:#d9d6cf;
  --tx:#1d1d1f; --tx2:#6b6a66; --tx3:#9c9a94;
  --blue:#3b6ef2; --green:#12946a; --amber:#c98a00; --red:#d64545;
  --hdr:rgba(247,246,243,.92); --nav:rgba(255,255,255,.94);
  --track:#eceae5; --dot:#e0ded8;
  --tagbg:#eef1fb; --tagtx:#3b5bd0;
  --okbg:#f0faf6; --okbd:#bfe3d4; --oktx:#0d7a56;
  --badbg:#fdf3f3; --badbd:#f0c9c9; --badtx:#b33;
  --midbd:#eddcb4; --midtx:#9a6a00;
  --toastbg:#1d1d1f; --toasttx:#ffffff;
  --r:14px;
}
html[data-theme="dark"]{
  --bg:#151517; --card:#1d1d20; --line:#2b2b30; --line2:#3a3a41;
  --tx:#f0efec; --tx2:#a5a39d; --tx3:#7b7973;
  --blue:#5b86f7; --green:#3fbf94; --amber:#e0b04a; --red:#f0736f;
  --hdr:rgba(21,21,23,.92); --nav:rgba(29,29,32,.95);
  --track:#2a2a2f; --dot:#33333a;
  --tagbg:#232a3d; --tagtx:#9db4f5;
  --okbg:#14261f; --okbd:#2c5c47; --oktx:#63d6a8;
  --badbg:#2a1a1a; --badbd:#5e3030; --badtx:#f08a86;
  --midbd:#4a3a1a; --midtx:#d9a53c;
  --toastbg:#f0efec; --toasttx:#151517;
}
html[data-theme="dark"] .instcard{background:linear-gradient(135deg,#1c2537,#1a1f2a);border-color:#2b3752}
html[data-theme="dark"] .instbtn.ghost{border-color:#3a4a6e}
html[data-theme="dark"] .instico.ok{background:#1c3a2d}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

header{position:sticky;top:0;z-index:20;background:var(--hdr);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 0 9px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.insticon{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line2);
  background:var(--card);display:none;align-items:center;justify-content:center;margin-left:auto;margin-right:2px}
.insticon.show{display:flex}
.htitle{font-size:15px;font-weight:600;letter-spacing:.3px}
.hsub{font-size:12px;color:var(--tx3);margin-top:1px}
.hprog{width:64px;height:64px;position:relative;flex:none}
.hprog svg{transform:rotate(-90deg)}
.hprog circle{stroke:var(--track)}
.hprog circle#hRing{stroke:var(--blue);transition:stroke-dashoffset .3s}
.hprog b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;color:var(--blue)}

.view{display:none;padding-top:16px}
.view.on{display:block;animation:fade .22s ease both}
#v-study.on{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 190px)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.empty{text-align:center;padding:44px 20px;color:var(--tx2);font-size:14px}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.35}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;
  background:var(--blue);color:#fff;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2)}
.btn:active{opacity:.85}

.cardwrap{perspective:1200px;margin-top:6px}
.wordcard{position:relative;width:100%;min-height:330px;border-radius:18px;
  transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,.8,.3,1);cursor:pointer}
.wordcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  display:flex;flex-direction:column;padding:22px 20px}
.face.back{transform:rotateY(180deg);overflow:auto}
.face.back .binner{flex:1;display:flex;flex-direction:column;justify-content:center}
.fmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3)}
.ftag{background:var(--tagbg);color:var(--tagtx);padding:2px 8px;border-radius:20px;font-size:11px}
.fcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.bigword{font-size:34px;font-weight:600;letter-spacing:.4px;word-break:break-word;padding:0 4px}
.ipa{font-size:15px;color:var(--tx2);margin-top:8px;font-family:"Segoe UI",sans-serif}
.hint{font-size:12px;color:var(--tx3);margin-top:20px}
.spk{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);display:flex;
  align-items:center;justify-content:center;margin-top:16px}
.spk svg{width:19px;height:19px;stroke:var(--tx2);fill:none;stroke-width:1.7}
.backword{font-size:15px;color:var(--tx3);font-weight:500}
.backdef{font-size:20px;font-weight:600;line-height:1.55;margin-top:8px}
.relbox{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.reltitle{font-size:11px;color:var(--tx3);letter-spacing:.5px;margin-bottom:8px}
.relrow{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--tx2);line-height:1.7;
  margin-bottom:2px;cursor:pointer;border-radius:8px}
.relrow:active{background:var(--tagbg)}
.relrow b{color:var(--tx);font-weight:500;flex:none}
.relrow .ri{font-size:12px;flex:none}
.relrow .rd{flex:1;min-width:0}
.relrow .rs{width:15px;height:15px;flex:none;stroke:var(--tx3);fill:none;stroke-width:1.7}

.rate{display:flex;gap:8px;margin-top:14px}
.rate button{flex:1;padding:13px 4px;border-radius:12px;border:1px solid var(--line2);
  font-size:14px;font-weight:500;background:var(--card);transition:transform .1s}
.rate button:active{transform:scale(.97)}
.rate .no{color:var(--badtx); border-color:var(--badbd)}
.rate .mid{color:var(--midtx); border-color:var(--midbd)}
.rate .yes{color:var(--oktx); border-color:var(--okbd)}
.rate .k{display:block;font-size:10px;color:var(--tx3);font-weight:400;margin-top:1px}
.rate[hidden]{display:none}

.bar{height:4px;background:var(--track);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .3s}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:6px 12px;border-radius:20px;border:1px solid var(--line);
  font-size:13px;color:var(--tx2);white-space:nowrap;background:var(--card)}
.tabs button.on{background:var(--tx);color:#fff;border-color:var(--tx)}

.row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .w{font-size:15px;font-weight:500}
.row .d{font-size:12px;color:var(--tx2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--dot)}
.dot.s1{background:#f0b429}.dot.s2{background:#7fb2f0}.dot.s3{background:var(--green)}
.grow{flex:1;min-width:0}

.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:14px;margin-bottom:12px;outline:none}
.search:focus{border-color:var(--line2)}

.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .lb{font-size:12px;color:var(--tx2)}
.stat .num{font-size:24px;font-weight:600;margin-top:2px}
.stat .num small{font-size:13px;font-weight:400;color:var(--tx3)}

.sec{margin-top:20px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sech h3{font-size:14px;margin:0;font-weight:600}
.sech span{font-size:12px;color:var(--tx3)}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .lab{font-size:14px}
.setrow .sub{font-size:12px;color:var(--tx3);margin-top:2px}
input[type=range]{width:120px;accent-color:var(--blue)}
.sw{width:46px;height:27px;border-radius:20px;background:#dedbd4;position:relative;transition:.2s;flex:none}
.sw.on{background:var(--green)}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{left:22px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--nav);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--tx3)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--tx)}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--toastbg);
  color:var(--toasttx);font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;
  transition:.25s;z-index:50;white-space:nowrap}
.toast.on{opacity:.94;transform:translate(-50%,0)}

.quizq{text-align:center;padding:26px 10px 18px}
.quizq .q{font-size:28px;font-weight:600;word-break:break-word}
.quizq .qi{font-size:14px;color:var(--tx2);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.opts button{text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);font-size:14px;line-height:1.45}
.opts button.ok{border-color:var(--okbd);background:var(--okbg);color:var(--oktx)}
.opts button.bad{border-color:var(--badbd);background:var(--badbg);color:var(--badtx)}
.opts button:disabled{cursor:default}

.spell{width:100%;padding:14px;font-size:22px;letter-spacing:2px;text-align:center;
  border:1px solid var(--line2);border-radius:12px;background:var(--card);outline:none}
.spell:focus{border-color:var(--blue)}
.spellhint{text-align:center;font-size:15px;color:var(--tx3);letter-spacing:4px;margin:14px 0}

.seg{display:flex;gap:6px}
.seg button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--tx2);background:var(--card)}
.seg button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

.forecast{display:flex;gap:6px;align-items:flex-end;height:96px;padding:6px 2px 0}
.forecast .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.forecast .cnum{font-size:11px;color:var(--tx2)}
.forecast .cbar{width:100%;max-width:26px;background:var(--blue);border-radius:4px;min-height:3px;opacity:.85}
.forecast .cbar.zero{background:var(--track)}
.forecast .clab{font-size:11px;color:var(--tx3)}
.instcard{display:flex;align-items:center;gap:13px;padding:15px;border-radius:var(--r);
  background:linear-gradient(135deg,#e9efff,#f3f7ff);border:1px solid #d9e3fb}
.instcard.done{background:var(--card);border-color:var(--line)}
.instico{width:42px;height:42px;flex:none;border-radius:12px;background:var(--blue);
  display:flex;align-items:center;justify-content:center}
.instico.ok{background:#e4f6ee}
.instbody{flex:1;min-width:0}
.instt{font-size:14px;font-weight:600}
.insts{font-size:12px;color:var(--tx3);margin-top:3px;line-height:1.5}
.instbtn{flex:none;border:0;background:var(--blue);color:#fff;font-size:13px;font-weight:500;
  padding:10px 14px;border-radius:11px;white-space:nowrap}
.instbtn.ghost{background:transparent;color:var(--blue);border:1px solid #c8d5f6}
.gstep{display:flex;gap:11px;margin-top:14px}
.gnum{width:22px;height:22px;flex:none;border-radius:50%;background:var(--blue);color:#fff;
  font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.gtxt{font-size:14px;line-height:1.6}
</style>
</head>

  var us = en.filter(function (v) { return /en[-_]US/i.test(v.lang || ''); });

  var local = en.filter(function (v) { return v.localService; });
  var pick = us[0] || gb[0] || local[0] || en[0] || null;
  if (pick) { enVoice = pick; voiceTried = true; }
  return enVoice;
}

function unlockSpeech() {
  if (speechUnlocked || !window.speechSynthesis) return;
  speechUnlocked = true;
  try {
    var u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  } catch (e) {}
}
if (window.speechSynthesis) {
  pickVoice();
  if (typeof speechSynthesis.addEventListener === 'function') {
    speechSynthesis.addEventListener('voiceschanged', pickVoice);
  } else {
    speechSynthesis.onvoiceschanged = pickVoice;
  }
}
document.addEventListener('touchend', unlockSpeech, { once: true, passive: true });
document.addEventListener('click', unlockSpeech, { once: true });

/* 系统语音不可用时的联网兜底 */
function playAudioFallback(text) {
  try {
    var url = 'https://dict.youdao.com/dictvoice?type=2&audio=' + encodeURIComponent(text);
    var a = audioCache[text];
    if (!a) { a = audioCache[text] = new Audio(url); a.preload = 'auto'; }
    a.currentTime = 0;
    var p = a.play();
    if (p && p.catch) p.catch(function () { warnNoVoice(); });
  } catch (e) { warnNoVoice(); }
}

function warnNoVoice() {
  if (fallbackWarned) return;
  fallbackWarned = true;
  toast('这台设备没装英文语音，也连不上网络发音');
}

function speak(text, manual) {
  if (!text) return;
  if (!manual && !S.cfg.speak) return;
  var synth = window.speechSynthesis;
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
    playAudioFallback(text);
    return;
  }
  try {
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.88;
    var v = enVoice || pickVoice();
    if (v) u.voice = v;
    var ok = false;
    var done = function () { ok = true; };
    u.onstart = done; u.onend = done;
    u.onerror = function () { if (!ok) playAudioFallback(text); };
    synth.speak(u);
    // 部分机型没有语音包时会静默失败，800ms 内没动静就走在线发音
    setTimeout(function () {
      if (!ok && !synth.speaking && !synth.pending) playAudioFallback(text);
    }, 800);
  } catch (e) {
    playAudioFallback(text);
  }
}

/* ---------- 队列 ---------- */
function buildQueue() {
  var now = Date.now();
  var due = [], neu = [];
  for (var i = 0; i < WORDS.length; i++) {
    var w = WORDS[i], s = S.w[w.i];
    if (!s) { neu.push(w.i); continue; }
    if (s.b > 0 && s.b < 6 && s.due <= now) due.push(w.i);
    else if (s.b >= 6 && s.due <= now) due.push(w.i);
  }
  due.sort(function (a, b) { return S.w[a].due - S.w[b].due; });
  var st = dayStat();
  var quota = Math.max(0, S.cfg.daily - st.n);
  neu = neu.slice(0, quota);
  var q = [], di = 0, ni = 0;
  while (di < due.length || ni < neu.length) {
    for (var k = 0; k < 2 && di < due.length; k++) q.push(due[di++]);
    if (ni < neu.length) q.push(neu[ni++]);
  }
  return q;
}

function startSession() {
  queue = buildQueue();
  answered = 0;
  roundTotal = queue.length;
  renderStudy();
}

  if (tip && s && s.b >= 1) tip.textContent = '隔 ' + (BOX_DAYS[Math.min(6, s.b + 1)] || 2) + ' 天';

function flipCard() {
  flipped = !flipped;
  var c = document.getElementById('wcard');
  if (!c) return;
  c.classList.toggle('flip', flipped);
  document.getElementById('rate').hidden = !flipped;
}

function rate(kind) {
  if (!cur) return;
  var w = cur, id = w.i, s = S.w[id], now = Date.now();
  var st = dayStat();
  var isNew = !s;
  if (!s) s = S.w[id] = { b: 0, due: 0, n: 0, ok: 0, bad: 0 };
  s.n++; s.last = now;
  if (kind === 0) {
    s.b = 1; s.bad++; s.due = now + 10 * MIN;
  } else if (kind === 1) {
    s.b = Math.max(1, s.b || 1);
    s.due = now + (BOX_DAYS[s.b] || 1) * 0.5 * DAY;
  } else {
    s.ok++;
    var nb = isNew ? 2 : (s.b || 0) + 1;
    s.b = Math.min(6, nb);
    s.due = now + (BOX_DAYS[s.b] || 1) * DAY;
  }
  if (isNew) st.n++; else st.r++;
  queue.shift();
  answered++;
  if (kind === 0) {
    var pos = Math.min(3, queue.length);
    queue.splice(pos, 0, id);
    roundTotal++;
  }
  save();
  renderStudy();
}

function updateHead() {
  var st = dayStat();
  var goal = S.cfg.daily;
  var pct = Math.min(100, Math.round(st.n / goal * 100));
  document.getElementById('hSub').textContent = '今日新学 ' + st.n + ' / ' + goal;
  document.getElementById('hPct').textContent = pct + '%';
  document.getElementById('hRing').setAttribute('stroke-dashoffset', (169.6 * (1 - pct / 100)).toFixed(1));
}

function renderWrongList() {

      '<span style="font-size:12px;color:var(--red)">错' + o.s.bad + '</span></div>';
  }).join('');
}

function startQuiz(mode, wrongOnly) {
  var pool = [];
  for (var i = 0; i < WORDS.length; i++) {
    var s = S.w[WORDS[i].i];
    if (!s) continue;
    if (wrongOnly && !(s.bad > 0 && s.b < 4)) continue;
    pool.push(WORDS[i]);
  }
  if (!pool.length) {
    toast(wrongOnly ? '目前没有错词，很干净' : '还没背过词，先去背几张卡片');
    return;
  }
  if (!wrongOnly && pool.length < 8) {
    pool = WORDS.slice(0, 80);
    toast('词量还少，先拿词库前 80 个练手');
  }
  var picks = shuffle(pool.slice()).slice(0, 10);
  Q = { mode: mode, list: picks, idx: 0, right: 0, wrongs: [], wrongOnly: !!wrongOnly };
  renderQuestion();
}

function renderQuestion() {
  var el = document.getElementById('quizBody');
  if (Q.idx >= Q.list.length) return renderQuizResult();
  var w = Q.list[Q.idx];
  var head = '<div class="bar" style="margin-bottom:14px"><i style="width:' +
    (Q.idx / Q.list.length * 100) + '%"></i></div>' +
    '<div style="font-size:12px;color:var(--tx3);text-align:center;margin-bottom:6px">第 ' +
    (Q.idx + 1) + ' / ' + Q.list.length + ' 题 · 答对 ' + Q.right + '</div>';

  if (Q.mode === 'choice') {
    var zh2en = Q.idx % 2 === 1;
    var opts = [w];
    var guard = 0;
    while (opts.length < 4 && guard++ < 400) {
      var c = WORDS[Math.floor(Math.random() * WORDS.length)];
      if (c.i === w.i) continue;
      var same = opts.some(function (o) { return o.d === c.d || o.w === c.w; });
      if (!same) opts.push(c);
    }
    opts = shuffle(opts);
    el.innerHTML = head +
      '<div class="quizq">' + (zh2en
        ? '<div class="q" style="font-size:20px;line-height:1.5">' + esc(w.d) + '</div>' +
          '<div class="qi">选出对应的英文</div>'
        : '<div class="q">' + esc(w.w) + '</div><div class="qi">/' + esc(w.p) + '/</div>') + '</div>' +
      '<div class="opts" id="opts">' + opts.map(function (o, k) {
        return '<button data-ok="' + (o.i === w.i) + '" onclick="answerChoice(this,' + o.i + ')">' +
          (zh2en ? esc(o.w) : esc(o.d)) + '</button>';
      }).join('') + '</div>';
    if (!zh2en && S.cfg.speak) speak(w.w);
  } else {
    el.innerHTML = head +
      '<div class="quizq"><div class="q" style="font-size:19px;line-height:1.6">' + esc(w.d) + '</div>' +
      '<div class="qi">' + w.s + ' · List ' + w.l + '</div></div>' +
      '<div class="spellhint">' + hintOf(w.w) + '</div>' +
      '<input class="spell" id="spellIn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入单词">' +
      '<div style="height:12px"></div>' +
      '<button class="btn" onclick="answerSpell()">提交</button>' +
      '<div style="height:8px"></div>' +
      '<button class="btn ghost" onclick="revealSpell()">想不起来，看答案</button>';
    var inp = document.getElementById('spellIn');
    inp.focus();
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') answerSpell(); });
  }
}

function hintOf(w) {
  var out = '';
  for (var i = 0; i < w.length; i++) {
    out += (i === 0 || w[i] === '-' || w[i] === ' ') ? w[i] : '_';
  }
  return out + '　(' + w.length + ')';
}

function answerChoice(btn, id) {
  var w = Q.list[Q.idx];
  var ok = id === w.i;
  var bs = document.querySelectorAll('#opts button');
  for (var i = 0; i < bs.length; i++) {
    bs[i].disabled = true;
    if (bs[i].dataset.ok === 'true') bs[i].classList.add('ok');
  }
  if (!ok) btn.classList.add('bad');
  markQ(w, ok);
  setTimeout(function () { Q.idx++; renderQuestion(); }, ok ? 380 : 1100);
}

function answerSpell() {
  var w = Q.list[Q.idx];
  var v = (document.getElementById('spellIn').value || '').trim().toLowerCase();
  if (!v) return;
  var ok = v === w.w.toLowerCase();
  var inp = document.getElementById('spellIn');
  inp.disabled = true;
  inp.style.color = ok ? 'var(--green)' : 'var(--red)';
  if (!ok) {
    toast('正确拼写：' + w.w);
    inp.value = w.w;
  }
  markQ(w, ok);
  setTimeout(function () { Q.idx++; renderQuestion(); }, ok ? 420 : 1400);
}

function revealSpell() {
  var w = Q.list[Q.idx];
  document.getElementById('spellIn').disabled = true;
  document.getElementById('spellIn').value = w.w;
  markQ(w, false);
  setTimeout(function () { Q.idx++; renderQuestion(); }, 1200);
}

function markQ(w, ok) {
  var s = S.w[w.i];
  if (!s) s = S.w[w.i] = { b: 1, due: Date.now() + DAY, n: 0, ok: 0, bad: 0 };
  s.n++;
  if (ok) { s.ok++; Q.right++; }
  else { s.bad++; s.b = 1; s.due = Date.now() + 10 * MIN; Q.wrongs.push(w.w); }
  save();
}

function renderQuizResult() {
  var el = document.getElementById('quizBody');

    (Q.wrongs.length ? '<div style="font-size:12px;color:var(--tx3);margin:4px 0 8px">这轮错的词</div>' +
      '<div class="card" style="padding:12px 14px;font-size:14px;line-height:1.9;color:var(--tx2)">' +
      Q.wrongs.join(' · ') + '</div>' : '') +
    '<div style="height:16px"></div>' +
    '<button class="btn" onclick="startQuiz(\'' + Q.mode + '\',' + (Q.wrongOnly ? 'true' : 'false') + ')">再来一轮</button>' +

    '</div>';
  document.body.appendChild(ov);
  speak(w.w);
}

/* ---------- 装到桌面 ---------- */
var installEvt = null;
var ONLINE_URL = 'https://xiangyang13145.github.io/English-four/';

function isStandalone() {
  try {
    if (window.matchMedia('(display-mode: standalone)').matches) return true;
    if (window.matchMedia('(display-mode: fullscreen)').matches) return true;
  } catch (e) {}
  return navigator.standalone === true;
}
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isAndroid() { return /Android/i.test(navigator.userAgent); }
function inWeChat() { return /MicroMessenger/i.test(navigator.userAgent); }
function isLocalFile() { return location.protocol === 'file:'; }

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  installEvt = e;
  if (view === 'me') renderMe();
});
window.addEventListener('appinstalled', function () {
  installEvt = null;
  syncInstallIcon();
  toast('已装到桌面，断网也能背');
  if (view === 'me') renderMe();
});

function syncInstallIcon() {
  var b = document.getElementById('installIcon');
  if (!b) return;
  b.className = 'insticon' + (isStandalone() ? '' : ' show');
}

function instCardHTML() {
  if (isStandalone()) {
    return '<div class="instcard done">' +
      '<div class="instico ok"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12946a" stroke-width="2.4"><path d="M4 12.5 9.5 18 20 7"/></svg></div>' +
      '<div class="instbody"><div class="instt">已装到桌面</div>' +
      '<div class="insts">现在打开就是全屏 App 的样子，断网也能背</div></div></div>';
  }
  if (isLocalFile()) {
    return '<div class="instcard">' +
      '<div class="instico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"><rect x="7" y="2" width="10" height="20" rx="2.4"/><path d="M11 18.5h2"/></svg></div>' +
      '<div class="instbody"><div class="instt">这是本地文件版</div>' +
      '<div class="insts">手机系统只允许把网页版装到桌面。点右边复制在线地址，用浏览器打开就能装</div></div>' +
      '<button class="instbtn" onclick="copyOnline()">复制地址</button></div>';
  }
  if (inWeChat()) {
    return '<div class="instcard">' +
      '<div class="instico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></div>' +
      '<div class="instbody"><div class="instt">现在在微信里，装不了</div>' +
      '<div class="insts">微信内置浏览器没有安装入口。点右上角「···」→「在浏览器打开」，再回来点安装</div></div>' +
      '<button class="instbtn" onclick="showInstallGuide()">看步骤</button></div>';
  }
  var label = installEvt ? '一键安装' : (isIOS() ? '添加到主屏' : '怎么装');
  return '<div class="instcard">' +
    '<div class="instico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"><rect x="7" y="2" width="10" height="20" rx="2.4"/><path d="M11 18.5h2"/></svg></div>' +
    '<div class="instbody"><div class="instt">装到手机桌面</div>' +
    '<div class="insts">' + (installEvt ? '点一下，系统会弹安装确认' : '三步搞定，装好全屏无地址栏') + '</div></div>' +
    '<button class="instbtn" onclick="tryInstall()">' + label + '</button></div>';
}

function tryInstall() {
  if (isStandalone()) { toast('已经装好了，现在就在 App 里'); return; }
  if (installEvt) {
    installEvt.prompt();
    installEvt.userChoice.then(function (r) {
      if (r && r.outcome === 'accepted') toast('正在安装…');
      installEvt = null;
      if (view === 'me') renderMe();
    });
    return;
  }
  showInstallGuide();
}

function copyOnline() {
  var done = function () { toast('地址已复制，粘贴到浏览器打开'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ONLINE_URL).then(done, function () { prompt('复制这个地址，在浏览器里打开：', ONLINE_URL); });
  } else {
    prompt('复制这个地址，在浏览器里打开：', ONLINE_URL);
  }
}

function showInstallGuide() {
  var head, steps, tip = '';
  if (isIOS()) {
    head = 'iPhone / iPad 这样装';
    steps = ['点屏幕底部中间的「分享」按钮（方框里一个向上箭头）',
             '在弹出菜单里往下滑，选「添加到主屏幕」',
             '右上角点「添加」，桌面就出现蓝底的「词」图标'];
  } else if (isAndroid()) {
    head = '安卓这样装';
    steps = ['点浏览器右上角的「⋮」三个点',
             '选「安装应用」或「添加到主屏幕」',
             '点「安装」/「添加」，桌面就出现蓝底的「词」图标'];
  } else {
    head = '电脑上这样装';
    steps = ['看地址栏右侧有没有一个「安装」小图标，点它',
             '没有就去右上角菜单里找「安装 四级1500」',
             '装好后可以固定到任务栏，像普通软件一样打开'];
  }
  if (inWeChat()) {
    tip = '你现在是在微信里打开的，微信没有安装入口。先点右上角「···」，选「在浏览器打开」，再照上面做。';
  } else if (isLocalFile()) {
    tip = '本地文件（file://）不能安装。先复制在线地址：' + ONLINE_URL;
  } else if (!('serviceWorker' in navigator)) {
    tip = '换个浏览器试试：安卓用 Chrome / Edge，iPhone 用 Safari。';
  }

  var ov = document.createElement('div');
  ov.id = 'instGuide';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:70;display:flex;align-items:flex-end';
  ov.onclick = function (e) { if (e.target === ov) document.body.removeChild(ov); };
  ov.innerHTML = '<div style="background:var(--card);color:var(--tx);width:100%;max-width:560px;margin:0 auto;' +
    'border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom))">' +
    '<div style="display:flex;justify-content:space-between;align-items:center">' +
      '<div style="font-size:17px;font-weight:600">' + head + '</div>' +
      '<button onclick="var g=document.getElementById(\'instGuide\');if(g)g.remove()" style="width:34px;height:34px;border-radius:50%;' +
      'border:1px solid var(--line2);background:transparent;color:var(--tx2);font-size:16px">×</button></div>' +
    steps.map(function (s, i) {
      return '<div class="gstep"><div class="gnum">' + (i + 1) + '</div><div class="gtxt">' + s + '</div></div>';
    }).join('') +
    (tip ? '<div style="margin-top:16px;padding:11px 13px;border-radius:11px;background:var(--tagbg);color:var(--tagtx);font-size:13px;line-height:1.6">' + tip + '</div>' : '') +
    '<div style="margin-top:16px;font-size:12px;color:var(--tx3);line-height:1.6">装好后桌面图标名字是「四级1500」，全屏打开、没有地址栏，断网也能背。' +
    '旧版里的学习进度不会自动带过来，先在旧版「导出进度」，再到新应用里「导入进度」。</div></div>';
  document.body.appendChild(ov);
}

/* ---------- 我的 ---------- */
function renderMe() {
  var learned = 0, mastered = 0, total = WORDS.length;
  for (var i = 0; i < WORDS.length; i++) {
    var s = S.w[WORDS[i].i];
    if (s) { learned++; if (s.b >= 4) mastered++; }
  }
  var st = dayStat();
  var streak = calcStreak();
  var dueToday = 0, now = Date.now();
  for (var j = 0; j < WORDS.length; j++) {
    var t = S.w[WORDS[j].i];
    if (t && t.b > 0 && t.due <= now) dueToday++;
  }
  var secBars = ['高频', '基础', '偶考'].map(function (sec) {
    var all = WORDS.filter(function (w) { return w.s === sec; });
    var done = all.filter(function (w) { return S.w[w.i] && S.w[w.i].b >= 4; }).length;
    var p = Math.round(done / all.length * 100);
    return '<div style="margin-top:14px"><div class="sech"><h3>' + sec + '词</h3>' +
      '<span>' + done + ' / ' + all.length + ' 掌握</span></div>' +
      '<div class="bar"><i style="width:' + p + '%"></i></div></div>';
  }).join('');

  var bakTxt, bakWarn = false;
  if (S.cfg.lastBak) {
    var bd = Math.floor((Date.now() - S.cfg.lastBak) / DAY);
    bakTxt = bd <= 0 ? '今天已备份' : (bd + ' 天前备份过');
    bakWarn = bd >= 7;
    if (bakWarn) bakTxt = bd + ' 天没备份了，建议导出一份';
  } else {
    bakTxt = learned > 0 ? '还没备份过，建议导出一份' : '存成文件，换手机时带得走';
    bakWarn = learned > 0;
  }

  var fc = forecastDays();
  var fmax = Math.max.apply(null, fc.concat([1]));
  var wk = '日一二三四五六';
  var d0 = new Date(); d0.setHours(0, 0, 0, 0);
  var chart = '<div class="forecast">' + fc.map(function (n, i) {
    var dt = new Date(d0.getTime() + i * DAY);
    var lab = i === 0 ? '今天' : i === 1 ? '明天' : '周' + wk.charAt(dt.getDay());
    var h = n === 0 ? 3 : Math.max(4, Math.round(n / fmax * 58));
    return '<div class="col">' +
      '<div class="cnum">' + (n || '') + '</div>' +
      '<div class="cbar ' + (n ? '' : 'zero') + '" style="height:' + h + 'px"></div>' +
      '<div class="clab">' + lab + '</div></div>';
  }).join('') + '</div>';

  document.getElementById('meBody').innerHTML =
    '<div style="margin-top:14px">' + instCardHTML() + '</div>' +
    '<div class="stat">' +
      '<div class="box"><div class="lb">已学</div><div class="num">' + learned + '<small> / ' + total + '</small></div></div>' +
      '<div class="box"><div class="lb">已掌握</div><div class="num">' + mastered + '<small> 个</small></div></div>' +
      '<div class="box"><div class="lb">今日待复习</div><div class="num">' + dueToday + '<small> 个</small></div></div>' +
      '<div class="box"><div class="lb">连续打卡</div><div class="num">' + streak + '<small> 天</small></div></div>' +
    '</div>' +
    '<div class="sec"><div class="sech"><h3>未来 7 天</h3><span>每天要复习的词量</span></div>' +
      '<div class="card" style="padding:12px 14px 10px">' + chart + '</div></div>' +
    '<div class="sec"><div class="sech"><h3>章节进度</h3><span>掌握 = 复习满 4 轮</span></div>' +
      '<div class="card" style="padding:6px 14px 18px">' + secBars + '</div></div>' +
    '<div class="sec"><div class="sech"><h3>设置</h3></div>' +
      '<div class="card">' +
        '<div class="setrow"><div><div class="lab">每日新词</div><div class="sub">现在 ' + S.cfg.daily + ' 个</div></div>' +
          '<input type="range" min="20" max="150" step="10" value="' + S.cfg.daily + '" oninput="setDaily(this.value)"></div>' +
        '<div class="setrow"><div><div class="lab">外观</div><div class="sub">夜间背词不刺眼</div></div>' +
          '<div class="seg">' + [['auto', '自动'], ['light', '浅色'], ['dark', '深色']].map(function (o) {
            return '<button class="' + ((S.cfg.theme || 'auto') === o[0] ? 'on' : '') + '" onclick="setTheme(\'' + o[0] + '\')">' + o[1] + '</button>';
          }).join('') + '</div></div>' +
        '<div class="setrow"><div><div class="lab">自动朗读</div><div class="sub">翻开新卡片时读一遍</div></div>' +
          '<div class="sw ' + (S.cfg.speak ? 'on' : '') + '" onclick="toggleSpeak(this)"><i></i></div></div>' +
        '<div class="setrow" onclick="testSpeak()"><div><div class="lab">发音检查</div>' +
          '<div class="sub">' + esc(voiceStatus()) + '</div></div>' +
          '<span style="color:var(--blue);font-size:13px">试听</span></div>' +
        '<div class="setrow" onclick="exportData()"><div><div class="lab">导出进度</div>' +
          '<div class="sub"' + (bakWarn ? ' style="color:var(--amber)"' : '') + '>' + esc(bakTxt) + '</div></div>' +
          '<span style="color:var(--tx3);font-size:13px">下载</span></div>' +
        '<div class="setrow" onclick="pickImport()"><div><div class="lab">导入进度</div>' +
          '<div class="sub">选择之前导出的 json 文件</div></div>' +
          '<span style="color:var(--tx3);font-size:13px">选择</span></div>' +
        '<div class="setrow" onclick="resetAll()"><div class="lab" style="color:var(--red)">清空学习进度</div>' +
          '<span style="color:var(--tx3);font-size:13px">需确认</span></div>' +
      '</div></div>' +
    '<div class="sec"><div class="sech"><h3>关于</h3></div>' +
      '<div class="card" style="padding:14px;font-size:13px;color:var(--tx2);line-height:1.7">' +
      '词表来自你提供的《四级高频核心1500词》，共 ' + total + ' 个主词（含派生词 ' +
      WORDS.reduce(function (a, w) { return a + (w.r ? w.r.length : 0); }, 0) + ' 个），分高频 / 基础 / 偶考三部分。' +
      '进度存在本机浏览器里，换设备不会同步。</div></div>';
  document.getElementById('hTitle').textContent = '我的';
  document.getElementById('hSub').textContent = '已学 ' + learned + ' / ' + total;
}

function setDaily(v) {
  S.cfg.daily = parseInt(v, 10); save(); updateHead();
  var st = document.querySelectorAll('.setrow .sub');
  if (st[0]) st[0].textContent = '现在 ' + S.cfg.daily + ' 个';
}
function toggleSpeak(el) {
  S.cfg.speak = !S.cfg.speak; save();
  el.classList.toggle('on', S.cfg.speak);
  if (S.cfg.speak) speak('hello', true);
}

function voiceStatus() {
  if (!window.speechSynthesis) return '浏览器不支持，改用在线发音';
  var vs = [];
  try { vs = speechSynthesis.getVoices() || []; } catch (e) {}
  if (!vs.length) return '系统语音还没加载，点一下试听';
  var en = vs.filter(function (v) { return /^en([-_]|$)/i.test(v.lang || ''); });
  if (!en.length) return '没装英文语音，会走在线发音';
  return '已就绪：' + en.length + ' 个英文语音';
}

function testSpeak() {
  unlockSpeech();
  pickVoice();
  toast(voiceStatus());
  setTimeout(function () { speak('vocabulary', true); }, 120);
}

function exportData() {
  var payload = JSON.stringify(S);
  try {
    var blob = new Blob([payload], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cet4-progress-' + today() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    S.cfg.lastBak = Date.now(); save();
    if (view === 'me') renderMe();
    toast('已导出到下载文件夹');
  } catch (e) {
    prompt('复制下面这段文字保存好：', payload);
  }
}

function pickImport() {
  var inp = document.getElementById('impFile');
  if (inp) inp.click();
}

function onImpFile(inp) {
  var f = inp.files && inp.files[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () { applyImport(rd.result); };
  rd.readAsText(f);
  inp.value = '';
}

function applyImport(txt) {
  try {
    var d = JSON.parse(txt);
    if (!d || typeof d !== 'object' || !d.w || !d.days) throw new Error('bad');
    S = d;
    if (!S.cfg) S.cfg = { daily: 60, speak: true };
    save();
    queue = []; Q = null;
    toast('已导入 ' + Object.keys(S.w).length + ' 个词的学习记录');
    go('me');
  } catch (e) {
    toast('这个文件不是本程序的进度数据');
  }
}
function resetAll() {  if (!confirm('清空所有学习记录？这个操作无法撤销。')) return;
  localStorage.removeItem(KEY);
  S = load(); queue = []; Q = null;
  toast('已清空');
  renderAll();
}

function calcStreak() {
  var n = 0, d = new Date();
  for (var i = 0; i < 400; i++) {
    var k = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    var rec = S.days[k];
    if (rec && (rec.n > 0 || rec.r > 0)) { n++; d.setDate(d.getDate() - 1); }
    else if (i === 0) { d.setDate(d.getDate() - 1); }
    else break;
  }
  return n;
}

/* ---------- 通用 ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function go(v) {
  view = v;
  var vs = document.querySelectorAll('.view'), bs = document.querySelectorAll('nav button');
  for (var i = 0; i < vs.length; i++) vs[i].classList.toggle('on', vs[i].id === 'v-' + v);
  for (var j = 0; j < bs.length; j++) bs[j].classList.toggle('on', bs[j].dataset.v === v);
  var ring = document.querySelector('.hprog');
  ring.style.visibility = v === 'study' ? 'visible' : 'hidden';
  var titles = { study: '背词', quiz: '测练', lib: '词库', me: '我的' };
  document.getElementById('hTitle').textContent = titles[v] || '';
  if (v === 'study') {
    if (!queue.length) startSession(); else updateHead();
  }
  if (v === 'quiz') { Q = null; renderQuiz(); document.getElementById('hSub').textContent = '选择题 / 拼写 / 错词本'; }
  if (v === 'lib') { renderLib(); }
  if (v === 'me') { renderMe(); }
  window.scrollTo(0, 0);
}
function renderAll() { go(view); }

document.querySelectorAll('nav button').forEach(function (b) {
  b.onclick = function () { go(b.dataset.v); };
});

document.getElementById('search').addEventListener('input', function (e) {
  libSearch = e.target.value.trim();
  renderLib();
});

// 滑动手势
(function () {
  var sx = 0, sy = 0, active = false;
  document.addEventListener('touchstart', function (e) {
    if (!e.target.closest('.wordcard')) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; active = true;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!active) return; active = false;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 60) return;
    if (!flipped) { flipCard(); return; }
    rate(dx > 0 ? 2 : 0);
  }, { passive: true });
})();

// 键盘
document.addEventListener('keydown', function (e) {
  if (view !== 'study' || !cur) return;
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  if (flipped && (e.key === '1' || e.key === '2' || e.key === '3')) rate(parseInt(e.key, 10) - 1);
  if (e.key === 's') speak(cur.w, true);
});

if (window.matchMedia) {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var onScheme = function () { if ((S.cfg.theme || 'auto') === 'auto') applyTheme(); };
  if (mq.addEventListener) mq.addEventListener('change', onScheme);
}

applyTheme();
syncInstallIcon();
startSession();
updateHead();
</script>

    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
